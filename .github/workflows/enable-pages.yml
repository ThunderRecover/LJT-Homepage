name: Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Try enabling Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Trying with GITHUB_TOKEN..."
          gh api --method POST -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/pages -f build_type=workflow && echo "SUCCESS" || echo "FAILED with GITHUB_TOKEN"
          
          echo "Checking current pages status..."
          gh api /repos/${{ github.repository }}/pages 2>&1 || echo "Not enabled"
