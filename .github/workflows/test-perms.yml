name: Test Perms

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check actions permissions
        run: |
          echo "Actions permissions:"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/permissions
          echo ""
          echo "Workflow permissions:"
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/permissions/workflow
          echo ""
          echo "Try pages with different accept:"
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}'
