name: Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const existing = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.info('Pages already enabled: ' + JSON.stringify(existing.data));
            } catch (e) {
              core.info('Get pages failed: ' + e.message);
              try {
                const created = await github.rest.repos.createPagesSite({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  build_type: 'legacy',
                  source: { branch: 'master', path: '/' },
                });
                core.info('Pages created: ' + JSON.stringify(created.data));
              } catch (e2) {
                core.setFailed('Create pages failed: ' + e2.message);
              }
            }
